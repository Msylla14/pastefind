<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PasteFind — Trouve la musique d'une vidéo</title>
<meta name="description" content="Colle un lien TikTok, Facebook ou Instagram, dépose un fichier audio ou laisse le micro écouter : PasteFind identifie le morceau et te dit où l'écouter.">
<meta name="theme-color" content="#0B0C10">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta property="og:type" content="website">
<meta property="og:title" content="PasteFind — Trouve la musique d'une vidéo">
<meta property="og:description" content="Colle un lien, dépose un fichier ou laisse le micro écouter. PasteFind identifie le morceau en quelques secondes.">
<meta property="og:url" content="https://pastefind.com">
<meta property="og:image" content="https://pastefind.com/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#0B0C10; --ground-2:#0F1116; --panel:#15171E; --panel-2:#1C1F29;
    --line:#272B36; --line-soft:#1E212A;
    --ink:#F3F2EF; --ink-2:#9BA0AD; --ink-3:#666B7A;
    --amber:#FFB224; --amber-2:#FFD27A; --amber-dim:#8A6118;
    --ok:#4ADE9B; --bad:#FF7A70;
    --r-lg:20px; --r-md:13px; --r-sm:9px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;background:var(--ground);
    background-image:
      radial-gradient(1100px 620px at 50% -12%, rgba(255,178,36,.085), transparent 62%),
      radial-gradient(760px 460px at 88% 104%, rgba(255,178,36,.035), transparent 60%);
    background-attachment:fixed;
    color:var(--ink);font-family:'Archivo',system-ui,-apple-system,sans-serif;
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
    padding:0 18px calc(64px + env(safe-area-inset-bottom));
  }
  ::selection{background:var(--amber);color:#14100A}
  .shell{width:100%;max-width:540px;margin:0 auto}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  :focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}
  a{color:var(--ink)}

  header.top{display:flex;align-items:center;justify-content:space-between;padding:calc(26px + env(safe-area-inset-top)) 2px 30px}
  .brand{display:flex;align-items:center;gap:11px}
  .glyph{width:32px;height:32px;flex:none;border-radius:50%;display:block;
    object-fit:cover;background:#040404;
    box-shadow:0 0 20px rgba(255,178,36,.26)}
  .word{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.025em}
  .word em{font-style:normal;color:var(--amber)}
  .badge{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);padding:4px 9px;border-radius:99px}

  .badge.lang{position:relative;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .badge.lang svg{width:9px;height:9px;opacity:.65;flex:none}
  .badge.lang select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;
    -webkit-appearance:none;appearance:none;border:none;background:none;font-size:16px}
  .badge.lang option{color:#111;background:#fff}
  .badge.lang:hover{color:var(--ink-2);border-color:var(--line)}

  .pitch{padding:0 2px 26px}
  .pitch h1{font-family:'Syne',sans-serif;font-weight:700;font-size:clamp(30px,8.4vw,40px);
    line-height:1.06;letter-spacing:-.03em;margin:0 0 12px;text-wrap:balance}
  .pitch h1 span{color:var(--amber)}
  .pitch p{margin:0;color:var(--ink-2);font-size:16.5px;max-width:40ch}

  .console{background:linear-gradient(180deg,var(--panel) 0%,var(--ground-2) 100%);
    border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 8px 20px;
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 26px 60px -34px #000}
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--ground);border-radius:var(--r-md);padding:4px}
  .mode{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 4px;border-radius:10px;
    font-size:13.5px;font-weight:500;color:var(--ink-3);transition:background .18s,color .18s}
  .mode svg{width:15px;height:15px;flex:none}
  .mode:hover{color:var(--ink-2)}
  .mode[aria-selected="true"]{background:var(--panel-2);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
  .mode[aria-selected="true"] svg{color:var(--amber)}
  .stage{padding:20px 12px 0}

  .field{display:flex;align-items:center;gap:10px;background:var(--ground);border:1px solid var(--line);
    border-radius:var(--r-md);padding:0 14px;transition:border-color .18s,box-shadow .18s}
  .field:focus-within{border-color:var(--amber-dim);box-shadow:0 0 0 3px rgba(255,178,36,.10)}
  .field svg{width:16px;height:16px;color:var(--ink-3);flex:none}
  .field input{flex:1;min-width:0;background:none;border:none;outline:none;padding:15px 0;font-size:15.5px}
  .field input::placeholder{color:var(--ink-3)}
  .hint{margin:11px 2px 0;font-size:13px;color:var(--ink-3);line-height:1.5}
  .hint b{color:var(--ink-2);font-weight:500}

  .drop{border:1px dashed var(--line);border-radius:var(--r-md);padding:30px 18px;text-align:center;
    transition:border-color .18s,background .18s;position:relative}
  .drop.armed{border-color:var(--amber-dim);background:rgba(255,178,36,.05)}
  .drop .ic{width:30px;height:30px;margin:0 auto 12px;color:var(--ink-3)}
  .drop.armed .ic{color:var(--amber)}
  .drop .t{font-size:15px;font-weight:500}
  .drop .s{font-size:13px;color:var(--ink-3);margin-top:4px}
  .drop .file{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--amber-2);margin-top:9px;word-break:break-all}
  #picker{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

  .mic-stage{text-align:center;padding:12px 0 4px}
  .mic-btn{width:92px;height:92px;border-radius:50%;margin:0 auto;display:grid;place-items:center;
    background:var(--panel-2);border:1px solid var(--line);color:var(--amber);transition:transform .18s,box-shadow .18s}
  .mic-btn:hover{transform:scale(1.04);box-shadow:0 0 34px rgba(255,178,36,.22)}
  .mic-btn.rec{background:var(--amber);color:#17120A;animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,178,36,.45)}50%{box-shadow:0 0 0 18px rgba(255,178,36,0)}}
  .mic-btn svg{width:32px;height:32px}
  .mic-stage .s{font-size:13.5px;color:var(--ink-3);margin-top:14px}

  .go{width:100%;margin-top:18px;padding:16px;border-radius:var(--r-md);background:var(--amber);color:#17120A;
    font-family:'Syne',sans-serif;font-weight:700;font-size:15.5px;letter-spacing:.015em;
    display:flex;align-items:center;justify-content:center;gap:9px;transition:filter .18s,transform .1s}
  .go:hover:not(:disabled){filter:brightness(1.08)}
  .go:active:not(:disabled){transform:translateY(1px)}
  .go:disabled{background:var(--panel-2);color:var(--ink-3);cursor:not-allowed}
  .go svg{width:17px;height:17px}

  .scan{padding:26px 12px 4px;display:none}
  .scan.on{display:block}
  .meter{display:flex;align-items:flex-end;gap:3px;height:56px}
  .meter i{flex:1;background:var(--amber-dim);border-radius:1.5px;height:12%;transform-origin:bottom;
    animation:vu 1.15s ease-in-out infinite}
  @keyframes vu{0%,100%{height:12%;background:var(--amber-dim)}50%{height:var(--peak,60%);background:var(--amber)}}
  .scan-txt{margin-top:18px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
  .scan-sub{text-align:center;font-size:12.5px;color:var(--ink-3);margin-top:7px}

  .result{margin-top:16px;display:none}
  .result.on{display:block;animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
  .card-top{display:flex;gap:16px;padding:18px;align-items:center}
  .sleeve{width:92px;height:92px;flex:none;border-radius:10px;position:relative;overflow:hidden;
    box-shadow:0 10px 26px -12px #000;background:var(--panel-2)}
  .sleeve .disc{position:absolute;inset:0;
    background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.9) 0 8%,transparent 8.5%),
      repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.09) 0 1px,transparent 1px 4px),
      linear-gradient(135deg,#5A4520,#241A0C)}
  .sleeve img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  .sleeve img.on{display:block}
  .meta{min-width:0;flex:1}
  .meta .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ok);margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .meta .lbl::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ok)}
  .meta .title{font-family:'Syne',sans-serif;font-weight:700;font-size:21px;line-height:1.14;
    letter-spacing:-.02em;margin-bottom:3px;overflow-wrap:anywhere}
  .meta .artist{color:var(--ink-2);font-size:14.5px;overflow-wrap:anywhere}
  .links{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft);border-top:1px solid var(--line-soft)}
  .plat{background:var(--panel);padding:14px 6px;text-align:center;font-size:12.5px;font-weight:500;color:var(--ink-2);
    display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;transition:background .16s,color .16s}
  .plat:hover{background:var(--panel-2);color:var(--ink)}
  .plat svg{width:17px;height:17px}
  .plat.sp svg{color:#1DB954}.plat.ap svg{color:#FC5C7D}.plat.yt svg{color:#FF4B4B}
  .tools{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line-soft)}
  .tool{flex:1;padding:11px;border-radius:var(--r-sm);background:var(--panel-2);color:var(--ink-2);
    font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px;
    transition:background .16s,color .16s}
  .tool:hover{background:var(--line);color:var(--ink)}
  .tool svg{width:14px;height:14px}
  .tool.done{color:var(--ok)}

  .oops{margin-top:16px;display:none}
  .oops.on{display:block;animation:rise .4s ease both}
  .oops-in{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:17px 19px}
  .oops .h{font-weight:600;font-size:15px;margin-bottom:5px;color:var(--bad)}
  .oops .b{font-size:14px;color:var(--ink-2);white-space:pre-line}

  .hist{margin-top:40px}
  .hist-hd{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px 13px;
    border-bottom:1px solid var(--line-soft);margin-bottom:6px}
  .hist-hd h2{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-3);margin:0}
  .clear{font-size:12.5px;color:var(--ink-3)}
  .clear:hover{color:var(--bad)}
  .row{display:flex;align-items:center;gap:13px;padding:12px 2px;border-bottom:1px solid var(--line-soft)}
  .row:last-child{border-bottom:none}
  .row .mini{width:36px;height:36px;border-radius:7px;flex:none;position:relative;overflow:hidden;background:var(--panel-2)}
  .row .mini .disc{position:absolute;inset:0;
    background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.9) 0 9%,transparent 9.5%),
      repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.08) 0 1px,transparent 1px 3px),
      linear-gradient(135deg,#5A4520,#241A0C)}
  .row .mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .row .rt{min-width:0;flex:1}
  .row .rt .a{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .rt .b{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .when{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);flex:none}
  .empty{padding:26px 2px;color:var(--ink-3);font-size:14px}

  footer.foot{margin-top:46px;padding-top:22px;border-top:1px solid var(--line-soft)}
  .trust{display:flex;gap:11px;align-items:flex-start;margin-bottom:18px}
  .trust svg{width:16px;height:16px;color:var(--ok);flex:none;margin-top:2px}
  .trust p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55}
  .fine{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3)}

  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
  @media (min-width:560px){.pitch{padding-bottom:32px}.stage{padding:22px 14px 0}}

  /* ══════════════════════════════════════════════════════════════
     GRAND ÉCRAN UNIQUEMENT — à partir de 1080 px de large.
     Un téléphone n'atteint jamais cette largeur : l'application
     Android reste donc exactement telle qu'elle est aujourd'hui.
     ══════════════════════════════════════════════════════════════ */

  /* Fond animé : ondes lentes qui partent du centre, comme un radar. */
  .bg{display:none}

  @media (min-width:1080px){

    .bg{
      display:block;position:fixed;inset:0;z-index:0;
      overflow:hidden;pointer-events:none;
    }
    .bg .ring{
      position:absolute;left:50%;top:44%;
      width:560px;height:560px;margin:-280px 0 0 -280px;
      border:1px solid rgba(255,178,36,.34);border-radius:50%;
      opacity:0;animation:onde 16s linear infinite;
      will-change:transform,opacity;
    }
    /* Aiguille de radar : un secteur clair qui tourne lentement. */
    .bg .sweep{
      position:absolute;left:50%;top:44%;
      width:1600px;height:1600px;margin:-800px 0 0 -800px;border-radius:50%;
      /* La trainee est DERRIERE l'aiguille : le balayage tourne vers la
         droite, donc la lumiere se dissipe dans le sens inverse. */
      background:conic-gradient(from 0deg,
        rgba(255,178,36,0) 0deg,
        rgba(255,178,36,0) 310deg,
        rgba(255,178,36,.014) 336deg,
        rgba(255,178,36,.052) 360deg);
      -webkit-mask-image:radial-gradient(circle,#000 0%,#000 48%,transparent 70%);
      mask-image:radial-gradient(circle,#000 0%,#000 48%,transparent 70%);
      animation:balayage 26s linear infinite;
      will-change:transform;
    }
    /* L'aiguille elle-meme : un trait fin sur le bord d'attaque. */
    .bg .sweep::after{
      content:"";position:absolute;left:50%;top:0;
      width:1.5px;height:50%;margin-left:-.75px;
      background:linear-gradient(to bottom,
        rgba(255,178,36,0) 0%,
        rgba(255,178,36,.16) 100%);
    }
    @keyframes balayage{to{transform:rotate(360deg)}}

    /* Notes de musique qui apparaissent et s'effacent. */
    .bg .note{
      position:absolute;left:var(--x);top:var(--y);
      font-size:var(--s);color:rgba(255,178,36,.5);
      opacity:0;animation:flotte 14s ease-in-out infinite;
      animation-delay:var(--d);will-change:transform,opacity;
    }
    @keyframes flotte{
      0%{opacity:0;transform:translateY(14px) rotate(-7deg)}
      22%{opacity:.7}
      55%{opacity:.5}
      100%{opacity:0;transform:translateY(-30px) rotate(7deg)}
    }

    .bg .r2{animation-delay:3.25s}
    .bg .r3{animation-delay:6.5s}
    .bg .r4{animation-delay:9.75s}
    .bg .halo{
      position:absolute;left:50%;top:44%;width:900px;height:900px;
      margin:-450px 0 0 -450px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,178,36,.035) 0%,transparent 62%);
      animation:respire 9s ease-in-out infinite;
    }
    @keyframes onde{
      0%{transform:scale(.16);opacity:0}
      14%{opacity:.55}
      100%{transform:scale(2.9);opacity:0}
    }
    @keyframes respire{
      0%,100%{transform:scale(1);opacity:.6}
      50%{transform:scale(1.14);opacity:1}
    }

    /* Deux colonnes : la recherche à gauche, les trouvailles à droite. */
    body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
    .shell{
      position:relative;z-index:1;
      max-width:1180px;
      display:grid;
      grid-template-columns:minmax(0,1.05fr) minmax(0,.85fr);
      grid-template-areas:
        "head    head"
        "pitch   hist"
        "console hist"
        "result  hist"
        "oops    hist"
        "foot    foot";
      column-gap:44px;
      align-items:start;
    }
    header.top{grid-area:head}
    .pitch{grid-area:pitch;padding-bottom:26px}
    .pitch h1{font-size:44px}
    .console{grid-area:console}
    .result{grid-area:result}
    .oops{grid-area:oops}
    footer.foot{grid-area:foot}

    .hist{
      grid-area:hist;margin-top:6px;
      background:linear-gradient(180deg,var(--panel) 0%,var(--ground-2) 100%);
      border:1px solid var(--line);border-radius:var(--r-lg);
      padding:18px 20px 8px;
      box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 26px 60px -34px #000;
      position:sticky;top:26px;
      max-height:calc(100vh - 52px);overflow:auto;
    }
    .hist-hd{padding-bottom:14px}
    .hist .row{padding:13px 0}
    .hist .empty{padding:22px 0 26px}

    .links{grid-template-columns:repeat(3,1fr)}
  }

  /* Écran large mais mouvement réduit : on garde les colonnes,
     on coupe l'animation. */
  @media (prefers-reduced-motion: reduce){.bg{display:none !important}}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="halo"></div>
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="ring r3"></div>
  <div class="ring r4"></div>
  <div class="sweep"></div>
  <span class="note" style="--x:11%;--y:26%;--s:20px;--d:0s">&#9834;</span>
  <span class="note" style="--x:26%;--y:69%;--s:15px;--d:2.4s">&#9835;</span>
  <span class="note" style="--x:44%;--y:15%;--s:16px;--d:5.1s">&#9834;</span>
  <span class="note" style="--x:63%;--y:78%;--s:21px;--d:1.3s">&#9836;</span>
  <span class="note" style="--x:79%;--y:33%;--s:17px;--d:6.8s">&#9835;</span>
  <span class="note" style="--x:90%;--y:62%;--s:15px;--d:3.9s">&#9834;</span>
  <span class="note" style="--x:34%;--y:44%;--s:14px;--d:8.2s">&#9836;</span>
</div>

<div class="shell">

  <header class="top">
    <div class="brand">
      <img class="glyph" src="/icon-192.png" alt="" width="32" height="32" decoding="async">
      <div class="word">Paste<em>Find</em></div>
    </div>
    <label class="badge lang">
        <span id="langcode">FR</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        <select id="lang" aria-label="Langue / Language">
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </label>
  </header>

  <div class="pitch">
    <h1 data-th="titre"></h1>
    <p data-t="accroche"></p>
  </div>

  <div class="console">
    <div class="modes" role="tablist" aria-label="Méthode d'identification">
      <button class="mode" role="tab" id="m-link" aria-selected="true" aria-controls="s-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        <span data-t="ongletLien"></span>
      </button>
      <button class="mode" role="tab" id="m-file" aria-selected="false" aria-controls="s-file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2z"/></svg>
        <span data-t="ongletFichier"></span>
      </button>
      <button class="mode" role="tab" id="m-mic" aria-selected="false" aria-controls="s-mic">

      }
      req = fetch(API + '/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: clean })
      });
    } else {
      if (!chosen) return;
      var fd = new FormData();
      fd.append('file', chosen);
      req = fetch(API + '/api/upload', { method: 'POST', body: fd });
    }

    scanning(true);

    withTimeout(req).then(function (r) {
      return r.json().catch(function () { return null; });
    }).then(function (data) {
      scanning(false);
      if (!data) { echec(e('illisible')); return; }
      if (data.error) { echec(erreurServeur(data.error)); return; }
      show(data);
    }).catch(function (e) {
      scanning(false);
      if (e && e.message === 'timeout') {
        echec(e('delai'));
      } else {
        echec(e('connexion'));
      }
    });
  }

  /* Le serveur répond en français : on reconnaît le cas et on affiche le
     message dans la langue de l'utilisateur. Le texte brut n'est montré
     qu'en dernier recours. */
  function erreurServeur(msg) {
    var m = String(msg).toLowerCase();
    if (m.indexOf('non reconnue') > -1 || m.indexOf('not recognized') > -1) return e('nonReconnue');
    if (m.indexOf('télécharger') > -1 || m.indexOf('telecharger') > -1 || m.indexOf('download') > -1) return e('videoBloquee');
    if (m.indexOf('volumineux') > -1 || m.indexOf('large') > -1) return e('tropGros');
    if (m.indexOf('format') > -1) return e('formatRefuse');
    return [e('analyse')[0], String(msg).replace(/^[^\wÀ-ÿ]+/, '')];
  }

  /* ---- résultat ---- */
  var current = null;

  function show(d) {
    var titre = d.title || t('titreInconnu');
    var a = d.subtitle || t('artisteInconnu');
    current = { t: titre, a: a, img: d.image || '', sp: d.spotify_url || '', ap: d.apple_music || '', yt: d.youtube_url || '' };

    $('rtitle').textContent = titre;
    $('rartist').textContent = a;

    var cover = $('cover');
    cover.classList.remove('on');
    if (d.image) {
      cover.onload = function () { cover.classList.add('on'); };
      cover.onerror = function () { cover.classList.remove('on'); };
      cover.src = d.image;
    } else {
      cover.removeAttribute('src');
    }

    var q = encodeURIComponent(titre + ' ' + a);
    $('l-sp').href = current.sp || ('https://open.spotify.com/search/' + q);
    $('l-ap').href = current.ap || ('https://music.apple.com/search?term=' + q);
    $('l-yt').href = current.yt || ('https://www.youtube.com/results?search_query=' + q);

    $('copytxt').textContent = t('copierTitre');
    $('copy').classList.remove('done');

    hideAll();
    $('result').classList.add('on');
    remember(current);
  }

  /* ---- outils ---- */
  $('copy').addEventListener('click', function () {
    if (!current) return;
    var txt = current.t + ' — ' + current.a;
    var done = function () {
      $('copytxt').textContent = t('copie');
      $('copy').classList.add('done');
      setTimeout(function () { $('copytxt').textContent = t('copierTitre'); $('copy').classList.remove('done'); }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, done);
    } else { done(); }
  });

  $('share').addEventListener('click', function () {
    if (!current) return;
    var txt = current.t + ' — ' + current.a + t('partageSuffixe');
    if (navigator.share) {
      navigator.share({ title: 'PasteFind', text: txt, url: 'https://pastefind.com' }).catch(function () {});
      return;
    }
    var done = function () {
      $('sharetxt').textContent = t('copiePartage');
      setTimeout(function () { $('sharetxt').textContent = t('partager'); }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, done);
    } else { done(); }
  });

  /* ---- historique ---- */
  function remember(track) {
    var list = store.read().filter(function (x) { return !(x.t === track.t && x.a === track.a); });
    list.unshift({ t: track.t, a: track.a, img: track.img, at: Date.now() });
    store.write(list);
    paint();
  }

  function ago(ms) {
    var s = Math.max(1, Math.round((Date.now() - ms) / 1000));
    if (s < 60) return t('instant');
    var m = Math.round(s / 60); if (m < 60) return m + t('min');
    var h = Math.round(m / 60); if (h < 24) return h + t('heure');
    return Math.round(h / 24) + t('jour');
  }

  function paint() {
    var list = store.read();
    var rows = $('rows');
    rows.textContent = '';
    $('empty').hidden = list.length > 0;
    $('clear').hidden = list.length === 0;

    list.forEach(function (item) {
      var row = document.createElement('div'); row.className = 'row';
      var mini = document.createElement('div'); mini.className = 'mini';
      var disc = document.createElement('div'); disc.className = 'disc';
      mini.appendChild(disc);
      if (item.img) {
        var im = document.createElement('img');
        im.alt = ''; im.loading = 'lazy';
        im.onerror = function () { im.remove(); };
        im.src = item.img;
        mini.appendChild(im);
      }
      var rt = document.createElement('div'); rt.className = 'rt';
      var a = document.createElement('div'); a.className = 'a'; a.textContent = item.t;
      var b = document.createElement('div'); b.className = 'b'; b.textContent = item.a;
      rt.appendChild(a); rt.appendChild(b);
      var when = document.createElement('div'); when.className = 'when'; when.textContent = ago(item.at);
      row.appendChild(mini); row.appendChild(rt); row.appendChild(when);
      rows.appendChild(row);
    });
  }

  $('clear').addEventListener('click', function () { store.write([]); paint(); });

  $('lang').addEventListener('change', function () {
    var code = $('lang').value;
    try { localStorage.setItem('pf.lang', code); } catch (err) {}
    appliquerLangue(code);
  });

  appliquerLangue(langueChoisie());
  refreshGo();

  /* ---- application installable ---- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
